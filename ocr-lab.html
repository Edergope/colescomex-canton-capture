<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Lab</title>
</head>
<body>
  <main style="font-family:system-ui;padding:16px;max-width:720px;margin:auto">
    <h1 style="font-size:20px">OCR Lab · prueba con tarjetas reales</h1>
    <p>Compara PaddleOCR y Tesseract con fotos reales en ESTE teléfono (no guarda nada).</p>
    <label>Motor <select id="engine"><option value="paddle">PaddleOCR v5 mobile</option><option value="paddle-tiny">PaddleOCR v6 tiny</option><option value="tesseract">Tesseract.js</option></select></label>
    <p><input type="file" id="file" accept="image/*" capture="environment"></p>
    <pre id="out" style="white-space:pre-wrap;background:#f2f2f2;padding:10px;border-radius:8px"></pre>
  </main>
  <script type="module" src="/src/lab.ts"></script>
</body>
</html>
